name: Setup Aviannextgen Panel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-panel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env

          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=database/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=aviannextgen/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=aviannextgen/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=aviannextgen_password/' .env

      - name: Start MariaDB
        run: |
          docker compose up -d database

      - name: Wait for MariaDB
        run: |
          echo "Waiting for MariaDB..."

          for i in {1..30}; do
            if docker compose exec -T database \
              healthcheck.sh \
              --connect \
              --innodb_initialized; then
              echo "MariaDB is ready."
              exit 0
            fi

            echo "MariaDB is not ready yet..."
            sleep 3
          done

          echo "MariaDB failed to become ready."
          docker compose logs database
          exit 1

      - name: Install Composer dependencies
        run: |
          docker compose run --rm app composer install \
            --no-interaction \
            --prefer-dist

      - name: Generate Laravel application key
        run: |
          docker compose run --rm app php artisan key:generate

      - name: Run Laravel migrations
        run: |
          docker compose run --rm app php artisan migrate --force

      - name: Verify database connection
        run: |
          docker compose run --rm app php artisan tinker --execute="
          DB::connection()->getPdo();
          echo 'REAL MYSQL/MARIADB CONNECTION SUCCESSFUL';
          "

      - name: Show database status
        run: |
          docker compose exec -T database \
            mariadb \
            -uaviannextgen \
            -paviannextgen_password \
            -e "SELECT VERSION();"

      - name: Show Laravel status
        run: |
          docker compose run --rm app php artisan --version

      - name: Show running containers
        run: |
          docker compose ps

      - name: Stop Docker services
        if: always()
        run: |
          docker compose down -v

      - name: Commit environment changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .env.example

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Configure Aviannextgen real MariaDB connection"
            git push origin HEAD:main
          fi

